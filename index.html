<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <!-- Ակնթարթային վերահասցեավորում Meta Refresh-ի միջոցով -->
    <meta http-equiv="refresh" content="0; url=https://mardriskai.com">
    <title>redirecting</title>
    
    <!-- Լրացուցիչ JavaScript վերահասցեավորում՝ ավելի հուսալի աշխատանքի համար -->
    <script type="text/javascript">
        window.location.href = "https://mardriskai.com";
    </script>
</head>
<body>
    <p>Եթե էջը ավտոմատ չի թարմացվում, խնդրում ենք սեղմել 
        <a href="https://mardriskai.com">այստեղ</a>:
    </p>
</body>
    <script type="text/javascript">
    // Վերցնում է հին հասցեի վերջավորությունը (օրինակ՝ /ru) և կպցնում նոր տիրույթին
    var currentPath = window.location.pathname + window.location.search;
    window.location.href = "https://mardriskai.com" + currentPath;
</script>

</html>
